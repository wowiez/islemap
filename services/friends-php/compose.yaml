services:
  islemap:
    image: islemap-php:1.9.7
    container_name: islemap-php
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - /opt/om/om_data/islemap:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
